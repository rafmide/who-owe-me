;justify-content:space-between;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}.calendar-foot button{border:0;background:transparent;color:var(--orange-dark);font-size:12px;font-weight:700;padding:7px}.settings-copy{color:#746e64;font-size:13px;line-height:1.8}.settings-buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.toast-wrap{position:fixed;z-index:50;top:max(14px,env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;padding:0 15px;pointer-events:none}.toast{display:flex;align-items:center;gap:13px;max-width:100%;padding:12px 14px 12px 17px;border-radius:99px;background:var(--ink);color:white;font-size:12px;box-shadow:0 12px 30px #201a1540;animation:toast-in .22s ease-out}.toast button{border:0;border-radius:99px;padding:7px 10px;background:#ffffff1b;color:white;font-size:12px;font-weight:700}@keyframes toast-in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}.privacy-foot{margin:40px 0 0;color:#aaa399;font-size:11px;text-align:center;line-height:1.7}.hidden{display:none!important}

<body>
<main class="shell"><section id="home" aria-live="polite"></section><section id="person" class="hidden"></section><p class="privacy-foot">A small ledger for real life. Your records stay on this device.<br>Make a backup before clearing your browser data.</p></main>
<div class="bottom-action"><button id="fab" class="primary" data-act="add"><i data-lucide="plus" width="18"></i><span>Add a debt</span></button></div>
<dialog id="sheet" aria-labelledby="sheetTitle"></dialog><div class="toast-wrap" id="toast" role="status" aria-live="polite"></div><input id="file" type="file" accept="application/json,.json" hidden>
<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),DAY=864e5,RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const icon=(name,size=18)=>`<i data-lucide="${name}" width="${size}" height="${size}" aria-hidden="true"></i>`,icons=()=>window.lucide?.createIcons();
const expCache={},exp=c=>expCache[c]??=(new Intl.NumberFormat('en',{style:'currency',currency:c})).resolvedOptions().maximumFractionDigits,fmt=(m,c)=>new Intl.NumberFormat(undefined,{style:'currency',currency:c,currencyDisplay:'narrowSymbol'}).format(m/10**exp(c));
const toMinor=(s,c)=>{const t=String(s).trim().replace(/[ ,\s]/g,'');if(!t||t==='.'||!/^[0-9]*\.?[0-9]*$/.test(t))return null;const [i,f='']=t.split('.');if(f.length>exp(c))return null;const n=Number((i||'0')+f.padEnd(exp(c),'0'));return Number.isSafeInteger(n)&&n>0?n:null};
const S={people:[],entries:[],meta:{cur:'NGN',backup:0},sort:'amount',volatile:false,bal:{}};let current=null,toastTimer,undoFn=null;
const idb=(()=>{let db;const open=()=>db??=new Promise((resolve,reject)=>{const r=indexedDB.open('who-owe-me',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('people',{keyPath:'id'});d.createObjectStore('entries',{keyPath:'id'});d.createObjectStore('meta')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});const run=(stores,mode,fn)=>open().then(d=>new Promise((resolve,reject)=>{const t=d.transaction(stores,mode);const result=fn(t);t.oncomplete=()=>resolve(result?.result);t.onerror=t.onabort=()=>reject(t.error)}));return{all:s=>run([s],'readonly',t=>t.objectStore(s).getAll()),meta:()=>run(['meta'],'readonly',t=>t.objectStore('meta').get('m')),write:ops=>run(['people','entries','meta'],'readwrite',t=>ops.forEach(([s,v,k])=>t.objectStore(s).put(v,k))),del:(s,k)=>run([s],'readwrite',t=>t.objectStore(s).delete(k))}})();
const balances=entries=>{const voided=new Set(entries.filter(e=>e.type==='void').map(e=>e.voids)),out={};for(const e of entries){if(e.type==='void'||voided.has(e.id))continue;const b=out[e.personId]??={};b[e.currency]=(b[e.currency]||0)+(e.type==='debt'?e.amountMinor:-e.amountMinor)}for(const p in out)for(const c in out[p])if(out[p][c]<=0)delete out[p][c];return out};
const commit=async ops=>{S.bal=balances(S.entries);if(S.volatile)return;try{await idb.write(ops)}catch{S.volatile=true;toast('Browser storage is unavailable. Export a backup.')}};
const hue=s=>[...s].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7),avatar=(name,large=false)=>{const h=hue(name);return `<span class="avatar${large?' large':''}" style="--avatar-bg:hsl(${h} 70% 92%);--avatar-fg:hsl(${h} 38% 30%)">${esc([...name.trim()][0]?.toUpperCase()||'?')}</span>`};
const ago=t=>{const d=Math.max(0,Math.floor((Date.now()-t)/DAY));return d<1?'today':d<31?`${d}d ago`:d<365?`${Math.floor(d/30)}mo ago`:`${Math.floor(d/365)}y ago`},dateStr=t=>new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}),ymd=(t=Date.now())=>{const d=new Date(t);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},sortedCur=b=>Object.entries(b).sort((a,c)=>c[1]/10**exp(c[0])-a[1]/10**exp(a[0])),major=b=>Object.entries(b).reduce((s,[c,m])=>s+m/10**exp(c),0),since=p=>Math.min(Infinity,...S.entries.filter(e=>e.personId===p.id&&e.type==='debt').map(e=>e.at));
const allCurrencies=(()=>{try{return Intl.supportedValuesOf('currency')}catch{return ['NGN','USD','GBP','EUR','GHS','KES','ZAR','CAD']}})(),popular=['NGN','USD','GBP','EUR','GHS','KES','ZAR','CAD'],currencyList=[...popular.filter(c=>allCurrencies.includes(c)),...allCurrencies.filter(c=>!popular.includes(c))];let names;try{names=new Intl.DisplayNames(undefined,{type:'currency'})}catch{names={of:c=>c}};
function toast(msg,undo){clearTimeout(toastTimer);undoFn=undo||null;$('#toast').innerHTML=`<div class="toast"><span>${esc(msg)}</span>${undo?'<button data-act="undo">Undo</button>':''}</div>`;toastTimer=setTimeout(()=>{$('#toast').innerHTML='';undoFn=null},4800)}
function totalsMarkup(tot){const rows=sortedCur(tot);return rows.length?rows.map(([c,m],i)=>`<div class="total-item"><span class="total-amount num" data-amount="${m}" data-currency="${c}">${fmt(m,c)}</span><span class="currency-pill">${c}</span></div>`).join(''):'<div class="total-amount">₦0</div>'}
function renderHome(){const rows=S.people.map(p=>({p,b:S.bal[p.id]||{}})).filter(r=>Object.keys(r.b).length).sort((a,b)=>S.sort==='amount'?major(b.b)-major(a.b):since(a.p)-since(b.p)),tot={};rows.forEach(r=>Object.entries(r.b).forEach(([c,m])=>tot[c]=(tot[c]||0)+m));$('#home').innerHTML=`<header class="topbar"><div class="brand">Who Owe Me?</div><button class="icon-btn" data-act="settings" aria-label="Backup and settings">${icon('sliders-horizontal',19)}</button></header><section class="hero ${rows.length?'':'hero-empty'}"><div class="hero-spark">${icon(rows.length?'sun':'sprout',31)}</div><p class="eyebrow">Your personal ledger</p><h1>${rows.length?'Money comes and goes.':'Nobody owes you.'}<br><em>${rows.length?'Keep the details.':'Enjoy the feeling.'}</em></h1><p class="hero-copy">${rows.length?'A clear view of what is owed to you, without awkward mental maths.':'When someone says “I’ll pay you back”, give your memory a little help.'}</p>${rows.length?`<div class="total-row">${totalsMarkup(tot)}</div>`:''}</section>${S.volatile?'<div class="empty-note"><p>Storage is unavailable in this browser.</p><span>Your changes may not persist. Export a backup before leaving.</span></div>':''}<div class="section-head"><h2 class="section-title">${rows.length?`The outstanding list · ${rows.length}`:'A little note'}</h2>${rows.length?`<button class="sort-button" data-act="sort">${icon('arrow-up-down',14)} ${S.sort==='amount'?'Most owed':'Oldest debt'}</button>`:''}</div>${rows.length?`<ul class="people">${rows.map(({p,b})=>`<li><button class="person-card" style="width:100%;text-align:left" data-act="person" data-id="${esc(p.id)}">${avatar(p.name)}<span class="person-main"><span class="person-name">${esc(p.name)}</span><span class="person-meta">Owing ${ago(since(p))}${p.phone?' · WhatsApp saved':''}</span></span><span class="person-total num">${sortedCur(b).map(([c,m])=>`<span>${fmt(m,c)}</span>`).join('')}</span><span class="chevron">${icon('chevron-right',17)}</span></button></li>`).join('')}</ul>`:`<div class="empty-note"><p>Write it down. Let it go.</p><span>Track a credit, a loan, or the money someone promised to send back. It stays private on this device.</span></div>`}`;icons()}
function renderPerson(p){if(!p){location.hash='#/';return}current=p;const b=S.bal[p.id]||{},cur=sortedCur(b),entries=S.entries.filter(e=>e.personId===p.id&&e.type!=='void').sort((a,b)=>b.at-a.at||b.createdAt-a.createdAt),voided=new Set(S.entries.filter(e=>e.type==='void').map(e=>e.voids));$('#person').innerHTML=`<header class="detail-head"><button class="back" data-act="back">${icon('arrow-left',17)} All people</button><button class="icon-btn" data-act="settings" aria-label="Backup and settings">${icon('sliders-horizontal',19)}</button></header><div class="detail-person">${avatar(p.name,true)}<h1>${esc(p.name)}</h1></div><section class="detail-total"><p class="eyebrow">${cur.length?'Still owed to you':'Account settled'}</p>${cur.length?totalsMarkup(b):'<div class="total-amount">All clear.</div>'}</section><div class="actions"><button class="primary" data-act="remind" ${cur.length?'':'disabled'}>${icon('send',16)} Send a reminder</button><button class="secondary" data-act="pay" ${cur.length?'':'disabled'}>${icon('check-circle',16)} Record payment</button></div><div class="section-head history-head"><h2 class="section-title">The history</h2><span class="person-meta">${entries.length} ${entries.length===1?'entry':'entries'}</span></div>${entries.length?`<ul class="history">${entries.map(e=>{const v=voided.has(e.id),d=e.type==='debt';return `<li class="history-item ${v?'voided':''}"><span class="entry-icon ${d?'':'payment'}">${icon(d?'arrow-up-right':'arrow-down-left',17)}</span><span class="entry-copy"><span class="entry-note">${esc(e.note||(d?'Credit given':'Payment received'))}</span><span class="entry-date">${dateStr(e.at)}${v?' · voided':''}</span></span><span class="entry-amount num">${d?'':'−'}${fmt(e.amountMinor,e.currency)}</span>${v?'':`<button class="tiny-action" data-act="void" data-id="${esc(e.id)}" aria-label="Void entry">${icon('undo-2',15)}</button>`}</li>`}).join('')}</ul>`:'<div class="empty-note"><p>Nothing on the books yet.</p><span>Add a debt to start this person’s history.</span></div>'}`;icons()}
function route(){const m=location.hash.match(/^#\/p\/([\w-]+)$/),p=m&&S.people.find(x=>x.id===m[1]);current=p||null;$('#home').classList.toggle('hidden',!!p);$('#person').classList.toggle('hidden',!p);p?renderPerson(p):renderHome();window.scrollTo(0,0)}
function openSheet(html){const d=$('#sheet');d.innerHTML=`<div class="sheet-panel">${html}</div>`;icons();d.showModal();initControls()};function closeSheet(){const d=$('#sheet');if(d.open)d.close()};$('#sheet').addEventListener('cancel',e=>{e.preventDefault();closeSheet()});$('#sheet').addEventListener('click',e=>{if(e.target===$('#sheet'))closeSheet()});
function label(text,content){return `<label><span class="field-label">${text}</span>${content}</label>`}
function dropdownMarkup(selected){return `<div class="input-wrap" data-dropdown><button type="button" class="field currency-trigger" data-act="currency-open" aria-haspopup="listbox" aria-expanded="false"><span>${selected} · ${esc(names.of(selected)||selected)}</span>${icon('chevron-down',16)}</button><div class="menu-pop hidden" role="listbox"><div class="menu-search"><input type="search" placeholder="Find a currency…" aria-label="Find a currency"></div><div data-options>${currencyList.map(c=>`<button type="button" class="menu-option" role="option" aria-selected="${c===selected}" data-currency="${c}"><span>${c}</span><small>${esc(names.of(c)||c)}</small></button>`).join('')}</div></div><input type="hidden" name="cur" value="${selected}"></div>`}
function datePickerMarkup(){return `<div class="input-wrap" data-date-picker><button type="button" class="field date-trigger" data-act="date-open" aria-haspopup="dialog" aria-expanded="false"><span class="date-copy">${icon('calendar-days',17)}<span class="date-value">${dateStr(new Date().setHours(12,0,0,0))}</span></span>${icon('chevron-down',16)}</button><input type="hidden" name="date" value="${ymd()}"><div class="calendar hidden" role="dialog" aria-label="Choose date"></div></div>`}
function entrySheet(type){const p=current,b=p?S.bal[p.id]||{}:{},curr=type==='payment'?Object.keys(b):currencyList,selected=curr.includes(S.meta.cur)?S.meta.cur:curr[0]||'NGN';openSheet(`<form data-form="entry" data-type="${type}" novalidate><div class="sheet-head"><h2 id="sheetTitle">${type==='payment'?'Record a payment':'Add a debt'}</h2><button type="button" class="close-btn" data-act="close" aria-label="Close">${icon('x',18)}</button></div><div class="form-stack">${p?'':label('Who owes you?',`<input class="field" name="name" list="people-options" required maxlength="60" autocomplete="off" placeholder="Their name"><datalist id="people-options">${S.people.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>`)}<div class="field-row">${label('Amount',`<input class="field num" name="amount" required inputmode="decimal" autocomplete="off" placeholder="0.00">`)}${label('Currency',dropdownMarkup(selected))}</div>${type==='payment'?'<button type="button" class="sort-button" style="justify-self:start;margin-top:-9px" data-act="full">Pay the full balance</button>':''}${label('Note <span style="font-weight:400">(optional)</span>',`<input class="field" name="note" maxlength="120" placeholder="${type==='payment'?'Bank transfer':'What was it for?'}" autocomplete="off">`)}${!p&&type==='debt'?label('WhatsApp number <span style="font-weight:400">(optional)</span>',`<input class="field" name="phone" type="tel" inputmode="tel" autocomplete="off" placeholder="0803 000 0000 or +44…">`):''}${label('Date',datePickerMarkup())}<p class="error" data-error role="alert"></p><button class="primary form-submit">${type==='payment'?'Save payment':'Add to ledger'} ${icon('arrow-up-right',16)}</button></div></form>`);if(!p)setTimeout(()=>$('#sheet [name=name]')?.focus(),80)}
function settingsSheet(){openSheet(`<div class="sheet-head"><h2 id="sheetTitle">Your data, your device.</h2><button class="close-btn" data-act="close" aria-label="Close">${icon('x',18)}</button></div><p class="settings-copy">Your ledger is saved in this browser on this device. It is not uploaded to a server. Clearing site data or losing this device can erase it, so keep a backup somewhere safe.</p><p class="person-meta" style="margin:16px 0 20px">${S.meta.backup?'Last backup: '+dateStr(S.meta.backup):'No backup made yet'}${S.volatile?' · Browser storage unavailable':''}</p><div class="settings-buttons"><button class="primary" data-act="export">${icon('download',16)} Export backup</button><button class="secondary" data-act="import">${icon('upload',16)} Import backup</button></div>`)}
function submitEntry(f){const v=Object.fromEntries(new FormData(f)),type=f.dataset.type,error=m=>{$('[data-error]',f).textContent=m},name=(current?.name??v.name??'').trim();if(!name)return error('Add the person’s name first.');const amountMinor=toMinor(v.amount,v.cur);if(!amountMinor)return error(`Enter a valid amount with up to ${exp(v.cur)} decimal places.`);const p=current||S.people.find(x=>x.name.toLowerCase()===name.toLowerCase());if(type==='payment'&&amountMinor>(S.bal[p.id]?.[v.cur]||0))return error(`That is more than the balance of ${fmt(S.bal[p.id]?.[v.cur]||0,v.cur)}.`);const person=p||{id:crypto.randomUUID(),name,phone:(v.phone||'').trim(),createdAt:Date.now()},e={id:crypto.randomUUID(),personId:person.id,type,amountMinor,currency:v.cur,note:(v.note||'').trim(),at:new Date(v.date+'T12:00:00').getTime(),createdAt:Date.now()},ops=[['entries',e]];if(!p){S.people.push(person);ops.push(['people',person])}S.entries.push(e);S.meta.cur=v.cur;ops.push(['meta',S.meta,'m']);commit(ops);closeSheet();route();toast(type==='payment'?'Payment recorded.':'Debt added to your ledger.')}
function voidEntry(id){const o=S.entries.find(e=>e.id===id);if(!o)return;const v={id:crypto.randomUUID(),personId:o.personId,type:'void',voids:id,amountMinor:0,currency:o.currency,at:Date.now(),createdAt:Date.now()};S.entries.push(v);commit([['entries',v]]);route();toast('Entry voided.',async()=>{S.entries=S.entries.filter(e=>e.id!==v.id);S.bal=balances(S.entries);if(!S.volatile)try{await idb.del('entries',v.id)}catch{toast('Undo could not be saved. Export a backup.')}route()})}
function phoneDigits(p){let d=String(p||'').replace(/[^\d+]/g,'');if(d.startsWith('+'))return d.slice(1).replace(/\D/g,'');d=d.replace(/\D/g,'');return d.startsWith('00')?d.slice(2):d.startsWith('0')?'234'+d.slice(1):d}
function remind(){const p=current,b=sortedCur(S.bal[p.id]||{});if(!b.length)return;const text=`Hi ${p.name.trim().split(/\s+/)[0]}, a quick reminder that you currently owe me ${b.map(([c,m])=>fmt(m,c)).join(' and ')}. Thank you!`,num=phoneDigits(p.phone);if(num.length>=8)window.open(`https://wa.me/${num}?text=${encodeURIComponent(text)}`,'_blank','noopener');else if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(()=>toast('No number saved. Reminder copied.'),()=>toast('No number saved for this person.'));else toast('Add a WhatsApp number to send a reminder.')}
function exportData(){const blob=new Blob([JSON.stringify({app:'who-owe-me',v:1,exportedAt:Date.now(),people:S.people,entries:S.entries},null,2)],{type:'application/json'}),a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:`who-owe-me-${ymd()}.json`});a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);S.meta.backup=Date.now();commit([['meta',S.meta,'m']]);closeSheet();route();toast('Backup downloaded.')}
async function importData(file){try{const d=JSON.parse(await file.text());if(d?.app!=='who-owe-me'||!Array.isArray(d.people)||!Array.isArray(d.entries))throw Error();const people=d.people.filter(p=>typeof p?.id==='string'&&typeof p.name==='string'&&p.name.trim()).map(p=>({id:p.id,name:p.name.slice(0,60),phone:String(p.phone||'').slice(0,30),createdAt:+p.createdAt||Date.now()})),ids=new Set([...people,...S.people].map(p=>p.id)),entries=d.entries.filter(e=>typeof e?.id==='string'&&ids.has(e.personId)&&['debt','payment','void'].includes(e.type)&&/^[A-Z]{3}$/.test(e.currency)&&Number.isSafeInteger(e.amountMinor)&&e.amountMinor>=0&&Number.isFinite(e.at)).map(e=>({id:e.id,personId:e.personId,type:e.type,voids:e.voids,amountMinor:e.amountMinor,currency:e.currency,note:String(e.note||'').slice(0,120),at:e.at,createdAt:+e.createdAt||e.at})),pm=new Map(S.people.map(p=>[p.id,p])),em=new Map(S.entries.map(e=>[e.id,e]));people.forEach(p=>{if(!pm.has(p.id))pm.set(p.id,p)});entries.forEach(e=>{if(!em.has(e.id))em.set(e.id,e)});S.people=[...pm.values()];S.entries=[...em.values()];await commit([...people.map(p=>['people',p]),...entries.map(e=>['entries',e])]);closeSheet();route();toast(`Imported ${entries.length} entries.`)}catch{toast('That file is not a valid Who Owe Me backup.')}}
function renderCalendar(wrap){const hidden=wrap.querySelector('[name=date]'),cal=$('.calendar',wrap),trigger=$('[data-act="date-open"]',wrap);let chosen=hidden.value||ymd(),view=new Date(chosen+'T12:00:00');view.setDate(1);const max=ymd();function paint(){const year=view.getFullYear(),month=view.getMonth(),first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),monthName=view.toLocaleDateString(undefined,{month:'long',year:'numeric'});let html=`<div class="calendar-top"><span class="calendar-title">${monthName}</span><span class="calendar-nav"><button type="button" data-cal="prev" aria-label="Previous month">${icon('chevron-left',15)}</button><button type="button" data-cal="next" aria-label="Next month">${icon('chevron-right',15)}</button></span></div><div class="calendar-grid">${['S','M','T','W','T','F','S'].map(d=>`<span class="calendar-dayname">${d}</span>`).join('')}`;for(let i=0;i<first;i++)html+='<span></span>';for(let d=1;d<=days;d++){const val=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,disabled=val>max;html+=`<button type="button" class="calendar-day ${val===chosen?'selected':''} ${val===max?'today':''}" data-day="${val}" ${disabled?'disabled':''} aria-pressed="${val===chosen}">${d}</button>`}html+=`</div><div class="calendar-foot"><button type="button" data-cal="today">Today</button><button type="button" data-cal="done">Done</button></div>`;cal.innerHTML=html;icons();trigger.querySelector('.date-value').textContent=new Date(chosen+'T12:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}paint();trigger.addEventListener('click',()=>{cal.classList.toggle('hidden');trigger.setAttribute('aria-expanded',String(!cal.classList.contains('hidden')))});cal.addEventListener('click',e=>{const day=e.target.closest('[data-day]'),nav=e.target.closest('[data-cal]');if(day){chosen=day.dataset.day;hidden.value=chosen;paint()}if(nav){if(nav.dataset.cal==='prev')view.setMonth(view.getMonth()-1);if(nav.dataset.cal==='next'){const n=new Date(view);n.setMonth(n.getMonth()+1);if(ymd(n.getTime())<=max)view=n}if(nav.dataset.cal==='today'){chosen=max;hidden.value=max;view=new Date(max+'T12:00:00');view.setDate(1)}if(nav.dataset.cal==='done'){cal.classList.add('hidden');trigger.setAttribute('aria-expanded','false')}paint()}})}
function initControls(){const f=$('#sheet form');if(!f)return;const dp=$('[data-date-picker]',f);if(dp)renderCalendar(dp);const dd=$('[data-dropdown]',f);if(dd){const trigger=$('[data-act="currency-open"]',dd),pop=$('.menu-pop',dd),search=$('input[type=search]',dd);trigger.addEventListener('click',()=>{const opening=pop.classList.contains('hidden');document.querySelectorAll('.menu-pop').forEach(x=>x.classList.add('hidden'));pop.classList.toggle('hidden',!opening);trigger.setAttribute('aria-expanded',String(opening));if(opening)search.focus()});search.addEventListener('input',()=>{const q=search.value.toLowerCase();$$('.menu-option',dd).forEach(o=>o.classList.toggle('hidden',!(`${o.dataset.currency} ${o.textContent}`.toLowerCase().includes(q))))});dd.addEventListener('click',e=>{const opt=e.target.closest('.menu-option');if(!opt)return;const c=opt.dataset.currency;$('[name=cur]',dd).value=c;trigger.querySelector('span').textContent=`${c} · ${names.of(c)||c}`;$$('.menu-option',dd).forEach(o=>o.setAttribute('aria-selected',String(o===opt)));pop.classList.add('hidden');trigger.setAttribute('aria-expanded','false');const amount=$('[name=amount]',f);if(amount)amount.focus()})}}
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t){if(!e.target.closest('[data-dropdown]'))$$('.menu-pop').forEach(x=>x.classList.add('hidden'));return}const a=t.dataset.act;if(a==='add')entrySheet('debt');else if(a==='pay')entrySheet('payment');else if(a==='close')closeSheet();else if(a==='settings')settingsSheet();else if(a==='back'){location.hash='#/'}else if(a==='person'){location.hash='#/p/'+t.dataset.id}else if(a==='sort'){S.sort=S.sort==='amount'?'age':'amount';renderHome()}else if(a==='remind')remind();else if(a==='void')voidEntry(t.dataset.id);else if(a==='export')exportData();else if(a==='import')$('#file').click();else if(a==='undo'){const fn=undoFn;undoFn=null;$('#toast').innerHTML='';fn?.()}else if(a==='full'){const f=t.closest('form'),c=f?.querySelector('[name=cur]')?.value;if(f&&current&&c){f.querySelector('[name=amount]').value=((S.bal[current.id]?.[c]||0)/10**exp(c)).toFixed(exp(c));f.querySelector('[name=amount]').focus()}}});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form=entry]');if(f){e.preventDefault();submitEntry(f)}});
$('#file').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)importData(f)});addEventListener('hashchange',route);
(async()=>{try{const[p,e,m]=await Promise.all([idb.all('people'),idb.all('entries'),idb.meta()]);S.people=p;S.entries=e;Object.assign(S.meta,m||{});navigator.storage?.persist?.()}catch{S.volatile=true}S.bal=balances(S.entries);route()})();
})();
</script></body></html>
